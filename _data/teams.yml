    <p>Explores parallel architectures, programming models, and performance reasoning. Students implement and analyze parallel algorithms on CPUs and GPUs, emphasizing decomposition, synchronization, and scalability. Topics include shared and distributed memory, threading, vectorization, profiling, and correctness. Projects connect theory to practice using contemporary toolchains and reproducible workflows. Students practice, reflect, and document.
